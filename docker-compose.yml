services:
  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    ports:
      - "4444:4444"
    volumes:
      - "./browser.json:/etc/selenoid/browsers.json:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./selenoid-video:/opt/selenoid/video"
      - "./selenoid-logs:/opt/selenoid/logs"
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "-conf"
      - "/etc/selenoid/browsers.json"
      - "-container-network"
      - "sprint_9"
      - "-video-output-dir"
      - "/opt/selenoid/video"
      - "-log-output-dir"
      - "/opt/selenoid/logs"
      - "-limit"
      - "5"
      - "-timeout"
      - "3m"
      - "-service-startup-timeout"
      - "2m"

  tests:
    build: .
    container_name: sprint9-tests
    depends_on:
      - selenoid
    environment:
      - SELENOID_URI=http://selenoid:4444/wd/hub
      - HEADLESS=true
      - WAIT_TIMEOUT=15

networks:
  default:
    name: sprint_9